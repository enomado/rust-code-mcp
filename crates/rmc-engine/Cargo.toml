[package]
name    = "rmc-engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["core"]
core = []
embeddings = [
  "dep:reqwest",
  "dep:hf-hub",
  "dep:fastembed",
  "dep:tokenizers",
  "dep:tokio",
  "dep:futures",
  "dep:toml",
  "fastembed/hf-hub-native-tls",
  # Use ORT at build/link time instead of dlopening libonnxruntime.so at runtime.
  # Plain Cargo builds download the CPU ORT archive; Nix builds override this
  # with ORT_LIB_PATH/ORT_PREFER_DYNAMIC_LINK so the pinned Nix ORT is used.
  "fastembed/ort-download-binaries",
]
embeddings-cuda = [
  "embeddings",
  "dep:candle-core",
  "fastembed/qwen3",
  "fastembed/cuda",
]
# AMD GPU через MIGraphX EP ONNX Runtime (замер на RX 7700 XT / gfx1101: ×32 к
# CPU на BGE-small fp32, batch 32x512). ROCm EP сюда НЕ добавлен намеренно: он
# в ORT депрекейтнут, а в системных сборках его просто нет —
# libonnxruntime_providers_rocm.so не поставляется, есть только migraphx.
#
# Фича аддитивна к `embeddings`: CPU-профиль продолжает работать в той же
# сборке, GPU — отдельный профиль. Скачанный `ort-download-binaries` архив при
# этом не используется (load-dynamic грузит системную библиотеку), но и не
# мешает — так фичи остаются аддитивными, как того требует cargo.
embeddings-migraphx = [
  "embeddings",
  "dep:ort",
  "ort/migraphx",
  # Каталог кэша скомпилированных ядер — см. ensure_migraphx_kernel_cache().
  "dep:directories",
]
# AMD (и любой другой DX12) GPU на ВИНДЕ — через DirectML EP.
#
# Отдельная фича, а не «GPU вообще», потому что MIGraphX под Windows НЕ
# существует: из ROCm под винду портирован не весь стек, MIGraphX в
# портированное не входит (ROCm/TheRock#1912 открыт), а в плагин-EP AMD для ORT
# под винду попал только DirectML. То есть это не «второй способ того же», а
# ЕДИНСТВЕННЫЙ способ считать эмбеддинги внутри тула на винде.
#
# `fastembed/directml` обязателен, и не ради EP: по нему вендоренный fastembed
# узнаёт DirectML в списке провайдеров и выключает memory pattern + parallel
# execution (init_session_builder), чего DirectML EP не переживает. Взять
# `ort/directml` без него — значит собрать сессию, которая падает или молча
# деградирует, причём не в этом файле.
embeddings-directml = [
  "embeddings",
  "dep:ort",
  "ort/directml",
  "fastembed/directml",
]
vector-store = [
  "embeddings",
  "dep:lancedb",
  "dep:arrow-array",
  "dep:arrow-schema",
  "dep:async-trait",
  "dep:directories",
  "dep:futures",
  "dep:tokio",
]
hybrid-search = [
  "embeddings",
  "vector-store",
  "dep:anyhow",
  "dep:tokio",
]

[dependencies]
# parser/ — rust-analyzer syntax
ra_ap_syntax = { workspace = true }

# schema.rs — Tantivy schema definitions
tantivy = { workspace = true }

# chunker/ — semantic code chunking
serde = { workspace = true }
uuid  = { workspace = true }

# embeddings/ — providers, backends, profiles
reqwest     = { workspace = true, optional = true }
hf-hub      = { workspace = true, optional = true }
fastembed   = { workspace = true, optional = true }
ort         = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
tokenizers  = { workspace = true, optional = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true, optional = true }
futures     = { workspace = true, optional = true }
toml        = { workspace = true, optional = true }

# vector_store/ — LanceDB-backed vector storage
lancedb      = { workspace = true, optional = true }
arrow-array  = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
async-trait  = { workspace = true, optional = true }
directories  = { workspace = true, optional = true }

# search/ — Tantivy BM25 + hybrid search
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
