[package]
name = "rust-code-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmc-server = { path = "../rmc-server" }

rmcp = { workspace = true }
# net/time/io-util — транспорт общего демона (unix-сокет, ожидание старта, прокси).
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Лок вокруг «поднять демона»: без него две одновременные сессии поднимут двух.
fs2 = "0.4"
# Ключ сокета (проект + env + версия бинаря).
sha2 = { workspace = true }
# Глобальный аллокатор под фичей `mimalloc` — см. её комментарий ниже.
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
# Examples and integration tests moved here with the executable package, so they
# retain direct access to the lower crates without widening the binary target's
# runtime dependency surface.
rmc-config = { path = "../rmc-config" }
rmc-engine = { path = "../rmc-engine" }
rmc-graph = { path = "../rmc-graph" }
rmc-indexing = { path = "../rmc-indexing" }

tantivy = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
notify = { workspace = true }
sled = { workspace = true }
sha2 = { workspace = true }
directories = { workspace = true }
ra_ap_syntax = { workspace = true }
ra_ap_ide = { workspace = true }
ra_ap_ide_db = { workspace = true }
"ra_ap_load-cargo" = { workspace = true }
ra_ap_project_model = { workspace = true }
ra_ap_vfs = { workspace = true }
ra_ap_paths = { workspace = true }
ra_ap_hir = { workspace = true }
ra_ap_hir_def = { workspace = true }
ra_ap_base_db = { workspace = true }
heed = { workspace = true }
text-splitter = { workspace = true }
fastembed = { workspace = true }
candle-core = { workspace = true }
hf-hub = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
lancedb = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
cargo_metadata = { workspace = true }
rs_merkle = { workspace = true }
sysinfo = { workspace = true }
tokenizers = { workspace = true }
rayon = { workspace = true }
num_cpus = { workspace = true }
tempfile = "3"

[features]
default = ["embedded"]
embedded = []
# GPU/CUDA embeddings (qwen3 reranker via candle). Requires nvcc/CUDA toolkit at build time.
# Default build is CPU-only; opt in with `cargo build --release --features cuda`.
cuda = ["rmc-server/cuda"]
# AMD GPU (MIGraphX). Требует системного ONNX Runtime со сборкой MIGraphX EP.
migraphx = ["rmc-server/migraphx"]
# GPU на винде (DirectML). Требует ORT со сборкой DirectML EP — DLL из NuGet
# `Microsoft.ML.OnnxRuntime.DirectML`; ROCm не нужен, идёт на DX12.
directml = ["rmc-server/directml"]
# Аллокатор mimalloc вместо системного.
#
# Зачем: glibc не отдаёт ядру арены, фрагментированные salsa-базой
# rust-analyzer — демон с ПУСТЫМ рантаймом держал 4.9 ГБ (замер и числа —
# `rmc_server::mcp::memory`). mimalloc возвращает память сам, по decay, и умеет
# принудительный сбор.
#
# Почему mimalloc, а не jemalloc: `tikv-jemalloc-sys` не собирается под
# Windows, а сервер нужен и там. Фича, а не дефолт: подмена глобального
# аллокатора — решение уровня развёртывания, и цену на своей машине надо
# увидеть замером, а не унаследовать молча.
mimalloc = ["dep:mimalloc", "rmc-server/mimalloc"]
