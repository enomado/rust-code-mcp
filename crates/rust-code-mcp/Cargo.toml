[package]
name = "rust-code-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmc-server = { path = "../rmc-server" }

rmcp = { workspace = true }
# net/time/io-util: shared-daemon transport (unix socket, startup wait, proxy).
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Lock around starting the daemon: without it two concurrent sessions would start two.
fs2 = "0.4"
# Socket key (project + env + binary version).
sha2 = { workspace = true }
# Global allocator behind the `mimalloc` feature; see its comment below.
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
# Examples and integration tests moved here with the executable package, so they
# retain direct access to the lower crates without widening the binary target's
# runtime dependency surface.
rmc-config = { path = "../rmc-config" }
rmc-engine = { path = "../rmc-engine" }
rmc-graph = { path = "../rmc-graph" }
rmc-indexing = { path = "../rmc-indexing" }

tantivy = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
notify = { workspace = true }
sled = { workspace = true }
sha2 = { workspace = true }
directories = { workspace = true }
ra_ap_syntax = { workspace = true }
ra_ap_ide = { workspace = true }
ra_ap_ide_db = { workspace = true }
"ra_ap_load-cargo" = { workspace = true }
ra_ap_project_model = { workspace = true }
ra_ap_vfs = { workspace = true }
ra_ap_paths = { workspace = true }
ra_ap_hir = { workspace = true }
ra_ap_hir_def = { workspace = true }
ra_ap_base_db = { workspace = true }
heed = { workspace = true }
text-splitter = { workspace = true }
fastembed = { workspace = true }
candle-core = { workspace = true }
hf-hub = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
lancedb = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
cargo_metadata = { workspace = true }
rs_merkle = { workspace = true }
sysinfo = { workspace = true }
tokenizers = { workspace = true }
rayon = { workspace = true }
num_cpus = { workspace = true }
tempfile = "3"

[features]
default = ["embedded"]
embedded = []
# GPU/CUDA embeddings (qwen3 reranker via candle). Requires nvcc/CUDA toolkit at build time.
# Default build is CPU-only; opt in with `cargo build --release --features cuda`.
cuda = ["rmc-server/cuda"]
# AMD GPU (MIGraphX). Requires a system ONNX Runtime built with the MIGraphX EP.
migraphx = ["rmc-server/migraphx"]
# GPU on Windows (DirectML). Requires an ORT built with the DirectML EP: the DLL from NuGet
# `Microsoft.ML.OnnxRuntime.DirectML`; no ROCm needed, it runs on DX12.
directml = ["rmc-server/directml"]
# mimalloc allocator instead of the system one.
#
# Why: glibc does not return to the kernel the arenas fragmented by the salsa database of
# rust-analyzer; a daemon with an EMPTY runtime held 4.9 GB (measurement and numbers in
# `rmc_server::mcp::memory`). mimalloc returns memory by itself, on decay, and supports
# a forced collection.
#
# Why mimalloc and not jemalloc: `tikv-jemalloc-sys` does not build on
# Windows, and the server is needed there too. A feature, not the default: replacing the global
# allocator is a deployment-level decision, and its cost on your machine should be
# seen by measurement, not inherited silently.
mimalloc = ["dep:mimalloc", "rmc-server/mimalloc"]
